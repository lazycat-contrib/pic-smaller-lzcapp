version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/pic-smaller.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: pic-smaller
    bump: patch
build:
  run_buildscript: false
images:
  # 主应用：上游只有 latest 可变 tag，无 immutable 家族 → custom/created + digest-pin + patch 自增
  - id: pic-smaller
    target: service
    service: pic-smaller
    source: gaoyaxuan/picsmaller
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Pic Smaller
    summary: "智能压缩 JPEG、PNG、WEBP、AVIF、SVG 和 GIF 图片"
